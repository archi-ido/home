<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website"> 
  <meta property="og:title" content="건축사사무소 이도">
  <meta property="og:description" content="포트폴리오">
  <meta property="og:image" content="https://archido.co.kr/content/logo.jpg">
  <meta property="og:url" content="https://archido.co.kr/portfolio">
  <title>포트폴리오</title>
  <link rel="icon" href="content/logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div data-site-header></div>

  <main class="container">
    <div class="page-head">
      <div class="eyebrow">Portfolio</div>
      <h1>포트폴리오</h1>
      <p class="lead">설계사무소가 진행한 프로젝트들을 소개합니다.</p>
    </div>

    <div class="cat-filter" id="cat-filter"></div>

    <div class="grid" id="grid">
      <p style="color:#888">불러오는 중…</p>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="assets/js/md.js"></script>
  <script src="assets/js/projects.js"></script>
  <script src="assets/js/site.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const grid = document.getElementById("grid");
      const filterBar = document.getElementById("cat-filter");
      const projects = await Projects.loadAll();
      if (!projects.length) {
        grid.innerHTML = `<p style="color:#888">아직 등록된 프로젝트가 없습니다. portfolio/001 폴더를 참고해 추가해 주세요.</p>`;
        return;
      }

      const cardHTML = (p) => `
        <a class="card" href="project?p=${p.folder}">
          <div class="card__thumb">
            ${Projects.thumbTag(p)}
          </div>
          <div class="card__body">
            <h3>${p.title}</h3>
            <p>${[p.location, p.year].filter(Boolean).join(" · ")}</p>
            ${p.category ? `<span class="card__cat">${p.category}</span>` : ""}
          </div>
        </a>`;

      const ALL = "__ALL__";
      const render = (val) => {
        const list = val === ALL ? projects : projects.filter((p) => p.category === val);
        grid.innerHTML = list.length
          ? list.map(cardHTML).join("")
          : `<p style="color:#888">해당 카테고리의 프로젝트가 없습니다.</p>`;
      };

      // 카테고리 필터 구성: portfolio/info.md 설정을 우선 사용.
      // 설정이 없으면 데이터에서 자동 추출(등장 순서 유지)로 폴백한다.
      const config = await Projects.loadCatConfig();
      let cats = config.items; // [{ value, label }]
      if (!cats.length) {
        const seen = [];
        projects.forEach((p) => { if (p.category && !seen.includes(p.category)) seen.push(p.category); });
        cats = seen.map((c) => ({ value: c, label: c }));
      }

      const buttons = [];
      if (config.showAll) buttons.push({ value: ALL, label: config.allLabel });
      buttons.push(...cats);

      filterBar.innerHTML = buttons
        .map((b, i) => `<button data-cat="${b.value}" class="${i === 0 ? "is-active" : ""}">${b.label}</button>`)
        .join("");

      filterBar.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        filterBar.querySelectorAll("button").forEach((b) => b.classList.toggle("is-active", b === btn));
        render(btn.dataset.cat);
      });

      render(buttons[0] ? buttons[0].value : ALL);
    });
  </script>
</body>
</html>
